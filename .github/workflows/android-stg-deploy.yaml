# Builds the Android app in release mode and hands it to Firebase App
# Distribution's tester group.
#
# Triggered by the android-stg-* tags that version-tagging.yaml pushes; there is
# no manual dispatch. The tag name is only used as release notes — the version
# the app ships as comes from client/android/version.json at the tagged commit.
#
# Gradle never reads version.json. Right before building, this workflow renders
# it into client/android/version.properties:
#
#   versionName=1.20260813.123059.beta
#   versionCode=1
#
# client/android/app/build.gradle.kts reads versionCode/versionName from that
# file (not from pubspec.yaml). The copy committed to the repo is a placeholder
# (0.0.0.dev / 1) for local debug/profile builds; CI overwrites it and never
# commits the result.
#
# The build itself is the same as `make dev` (run from client/), just --release
# instead of debug, and with the same .env requirement: API_BASE_URL is read
# from it both by --dart-define-from-file (Dart side) and directly by Gradle
# (BuildConfig.API_BASE_URL). Signing also works exactly like local dev (see the
# main README), except that CI writes client/android/signing.properties and the
# keystore it points at by decoding secrets instead of expecting them on disk.
#
# Everything secret comes from the protected `staging` environment:
#
#   secrets.CLIENT_ENV                             Base64 contents of a working client/.env
#   secrets.ANDROID_SIGNING_PROPERTIES             Base64 contents of client/android/signing.properties
#   secrets.ANDROID_KEYSTORE                       Base64 release keystore, decoded to the relative
#                                                  keystore.path that signing.properties names, under
#                                                  client/android/app/
#   secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS  Base64 service account JSON (App Distribution Admin only)
#   secrets.FIREBASE_APP_ID                        Firebase App ID for dev.norelease.paperdoll
#   vars.FIREBASE_TESTER_GROUP                     Tester group alias, currently `Dev`

name: Android Staging Deploy

on:
  push:
    tags:
      - "android-stg-*"

permissions:
  # actions/checkout needs this to read the repo at the pushed tag.
  contents: read

jobs:
  deploy:
    name: Build and distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Defense in depth: nothing stops a human from pushing an android-stg-*
      # tag by hand yet — there's no GitHub Ruleset restricting tag creation or
      # direct pushes to deploy/** — so this is currently the only enforcement.
      # It's a step rather than a job-level `if` so that a misconfigured check
      # fails loudly instead of looking like a no-op success.
      - name: Verify tag was created by the release bot
        if: github.actor != 'norelease-bot[bot]'
        run: |
          echo "::error::Tag pushed by '${{ github.actor }}', not the release bot. Refusing to deploy."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: ./.github/actions/setup-flutter

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Flutter uses the installed JDK to build the app
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Write .env
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: echo "$CLIENT_ENV" | base64 -d > client/.env

      - name: Read version from version.json
        id: version
        run: |
          set -euo pipefail
          version_name=$(jq -r '.versionName // empty' client/android/version.json)
          build_number=$(jq -r '.buildNumber // empty' client/android/version.json)
          if [[ -z "$version_name" || -z "$build_number" ]]; then
            echo "::error::client/android/version.json is missing versionName or buildNumber."
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Write version.properties
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          {
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$BUILD_NUMBER"
          } > client/android/version.properties

      - name: Decode signing.properties
        env:
          ANDROID_SIGNING_PROPERTIES: ${{ secrets.ANDROID_SIGNING_PROPERTIES }}
        run: echo "$ANDROID_SIGNING_PROPERTIES" | base64 -d > client/android/signing.properties

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          keystore_path=$(grep '^keystore.path=' client/android/signing.properties | cut -d= -f2-)
          echo "$ANDROID_KEYSTORE" | base64 -d > "client/android/app/$keystore_path"

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Decode Firebase service account
        env:
          FIREBASE_APP_DISTRIBUTION_CREDENTIALS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
        run: echo "$FIREBASE_APP_DISTRIBUTION_CREDENTIALS" | base64 -d > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
          RELEASE_NOTES: "Release ${{ github.ref_name }}"
        run: |
          firebase appdistribution:distribute \
            client/build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "$RELEASE_NOTES"
