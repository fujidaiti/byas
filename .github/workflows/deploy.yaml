name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      REDOCLY_VERSION: 2.35.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: redocly-cli-${{ env.REDOCLY_VERSION }}

      - name: Build
        run: npx @redocly/cli@${{ env.REDOCLY_VERSION }} build-docs api/api.yaml -o dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # DRAFT: Distributes the compiled Android app to testers via Firebase App
  # Distribution. See TODO.md for the prerequisites that still need wiring up
  # (release signing, secrets, Firebase project) before this can ship a build.
  distribute-android:
    name: Distribute Android app (Firebase App Distribution)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: The Flutter SDK / pub-cache setup below is duplicated from
      # client_health.yaml. TODO: extract into a composite action and reuse.
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # TODO: Build a real config file from secrets instead of the checked-in
      # example. The app reads its API base URL via --dart-define-from-file.
      - name: Create .env file
        run: cp .env.example .env

      # TODO: Restore the release keystore from secrets and point the Gradle
      # release signingConfig at it. android/app/build.gradle.kts currently
      # signs release builds with the debug keys, which is not distributable.

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: client/build/app/outputs/flutter-apk/app-release.apk

  # DRAFT: Distributes the compiled iOS app to TestFlight. Requires a macOS
  # runner and Apple code signing. See TODO.md for the prerequisites (signing
  # certificate, provisioning profile, ExportOptions.plist, App Store Connect
  # API key) that still need wiring up before this can upload a build.
  distribute-ios:
    name: Distribute iOS app (TestFlight)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # TODO: Build a real config file from secrets instead of the checked-in
      # example. The app reads its API base URL via --dart-define-from-file.
      - name: Create .env file
        run: cp .env.example .env

      # TODO: Set up iOS code signing before building a real release:
      #   - import the distribution certificate and provisioning profile from
      #     secrets (e.g. apple-actions/import-codesign-certs)
      #   - add ios/ExportOptions.plist configured for app-store distribution
      # Without these, `flutter build ipa` cannot produce a signed archive.

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --dart-define-from-file=.env \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: client/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
