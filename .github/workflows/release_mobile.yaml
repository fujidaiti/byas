# DRAFT: Builds and distributes the compiled mobile apps when a release tag is
# pushed. Android goes to Firebase App Distribution, iOS to TestFlight. See
# TODO.md for the prerequisites (release signing, code signing, secrets) that
# still need wiring up before this can ship a real build.
name: Release mobile apps

on:
  push:
    tags:
      - "v*"
  # Allow cutting a distribution build manually from any ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize per tag/ref so two release runs don't race.
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute-android:
    name: Distribute Android app (Firebase App Distribution)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: The Flutter SDK / pub-cache setup below is duplicated from
      # client_health.yaml. TODO: extract into a composite action and reuse.
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # TODO: Build a real config file from secrets instead of the checked-in
      # example. The app reads its API base URL via --dart-define-from-file.
      - name: Create .env file
        run: cp .env.example .env

      # TODO: Restore the release keystore from secrets and point the Gradle
      # release signingConfig at it. android/app/build.gradle.kts currently
      # signs release builds with the debug keys, which is not distributable.

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: client/build/app/outputs/flutter-apk/app-release.apk

  distribute-ios:
    name: Distribute iOS app (TestFlight)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # TODO: Build a real config file from secrets instead of the checked-in
      # example. The app reads its API base URL via --dart-define-from-file.
      - name: Create .env file
        run: cp .env.example .env

      # TODO: Set up iOS code signing before building a real release:
      #   - import the distribution certificate and provisioning profile from
      #     secrets (e.g. apple-actions/import-codesign-certs)
      #   - add ios/ExportOptions.plist configured for app-store distribution
      # Without these, `flutter build ipa` cannot produce a signed archive.

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --dart-define-from-file=.env \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: client/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
