# Tags the commit that bumps a version file to trigger a release build.
#
# Pushing a version bump to main or a deploy/** branch is the only action
# a developer takes. For each build target in the matrix below, this workflow
# diffs that target's version.json against the previous commit and validates
# the bump. If it's valid and the new versionName ends in .beta, the workflow
# pushes a <tag_prefix>-<versionName> tag, which is what starts that target's
# deploy.
#
# See tool/version.sh for the version file format and the versionName scheme.
#
# The tag has to be pushed with the release bot's GitHub App token rather than
# the default GITHUB_TOKEN: GitHub suppresses workflow triggers for events
# created with GITHUB_TOKEN, so a tag pushed that way would never start the
# deploy workflow.
#
# The token generation requires these repo/org-level variables:
#
#   vars.NORELEASE_BOT_APP_ID          The release bot's GitHub App ID
#   secrets.NORELEASE_BOT_PRIVATE_KEY  The release bot's GitHub App private key
#
# See DEPLOY.md for the overview of the entire deployment pipeline.
name: Version Tagging

on:
  push:
    branches:
      - main
      - "deploy/**"
    paths:
      - client/android/version.json
      - client/ios/version.json
      - server/version.json

concurrency:
  group: version-tagging
  cancel-in-progress: false

jobs:
  tag:
    name: Validate version.json and tag ${{ matrix.name }} release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Android
            version_file: client/android/version.json
            tag_prefix: android-stg
          - name: iOS
            version_file: client/ios/version.json
            tag_prefix: ios-stg
          - name: Server
            version_file: server/version.json
            tag_prefix: server
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NORELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.NORELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Export previous version.json
        id: previous-version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          set -euo pipefail

          # Leaving the file absent is how the next step is told there is no
          # previous version (the very first bump, or a new branch).
          path="$RUNNER_TEMP/prev-version.json"
          git show "$BEFORE_SHA:$VERSION_FILE" > "$path" 2>/dev/null || rm -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Validate version bump
        env:
          PREVIOUS_VERSION: ${{ steps.previous-version.outputs.path }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: tool/version.sh comp "$PREVIOUS_VERSION" "$VERSION_FILE"

      - name: Resolve tag to create
        id: tag
        env:
          VERSION_FILE: ${{ matrix.version_file }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
        run: |
          set -euo pipefail

          version_name=$(jq -r '.versionName' "$VERSION_FILE")
          if [[ "$version_name" != *.beta* ]]; then
            echo "$version_name is not a beta version; skipping tag creation."
            exit 0
          fi

          # The version may be unchanged (a push that only reformatted the file,
          # or a re-run of this workflow), in which case the tag is already
          # there and creating it again would fail.
          tag_name="$TAG_PREFIX-$version_name"
          if git rev-parse -q --verify "refs/tags/$tag_name" > /dev/null; then
            echo "Tag $tag_name already exists; nothing to do."
            exit 0
          fi

          echo "name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.tag.outputs.name != ''
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Creating tag $TAG_NAME"
          git tag "$TAG_NAME" "$AFTER_SHA"
          git push origin "$TAG_NAME"
