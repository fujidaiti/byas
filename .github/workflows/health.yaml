name: Health

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: ./.github/actions/setup-flutter

      - name: Verify generated code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Format
        run: dart format . -o none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2

      - name: Check server formatting
        working-directory: server
        run: |
          golangci-lint fmt ./...
          git diff --exit-code

      - name: Lint server
        working-directory: server
        run: golangci-lint run ./...

      - name: Set up Redocly CLI
        id: redocly
        uses: ./.github/actions/setup-redocly

      - name: Prettier
        run: npx prettier --check "**/*.{json,yaml,yml,md}"

      - name: Validate API spec
        run: npx @redocly/cli@${{ steps.redocly.outputs.version }} lint api/api.yaml

  testing:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Test server
        working-directory: server
        run: go test ./...
