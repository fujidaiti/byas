name: Set up Node.js tooling
description:
  Sets up Node.js and installs pinned JS tools (redocly, prettier,
  openapi-generator-cli) via npm ci

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - shell: bash
      run: npm ci
