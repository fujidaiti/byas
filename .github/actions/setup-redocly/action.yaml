name: Set up Redocly CLI
description:
  Sets up Node.js and caches npm packages for running @redocly/cli via npx

inputs:
  version:
    description: "@redocly/cli version to use"
    required: false
    default: "2.35.1"

outputs:
  version:
    description: "The @redocly/cli version that was set up"
    value: ${{ inputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: redocly-cli-${{ inputs.version }}
