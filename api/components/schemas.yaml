Feed:
  type: object
  required: [id, url, title]
  properties:
    id:
      type: integer
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedCandidate:
  description:
    A feed discovered via search that can be subscribed to (has no local ID yet)
  type: object
  required: [url, title]
  properties:
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedEntry:
  type: object
  required: [id, feed_id, url, title]
  properties:
    id:
      type: integer
    feed_id:
      type: integer
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    content:
      type: string
    published_at:
      type: string
      format: date-time
    snapshot_at:
      type: string
      format: date-time
    reading_list_item_id:
      description:
        The id of the reading list item backing this entry, if it is currently
        saved (unarchived). Absent when the entry is not saved.
      type: integer

ReadingListItem:
  type: object
  required: [id, resource_id, kind, title, saved_at]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this item — the web article ID for
        `web_article`, or the feed entry ID for `feed_entry`. Use this to
        navigate directly to the appropriate reader.
      type: integer
    kind:
      description: The kind of the reading list item.
      type: string
      enum: [web_article, feed_entry]
    title:
      type: string
    description:
      type: string
    saved_at:
      type: string
      format: date-time

Story:
  type: object
  required: [id, title]
  properties:
    id:
      type: integer
    title:
      type: string
    description:
      type: string
    source:
      type: string
    published_at:
      type: string
      format: date-time

Error:
  type: object
  required: [message]
  properties:
    message:
      type: string
