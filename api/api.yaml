openapi: "3.0.3"
info:
  title: Paperdoll API
  version: "0.1.0"

paths:
  /health:
    $ref: "./paths/health.yaml"
  /newspapers/today:
    $ref: "./paths/newspapers.yaml#/today"
  /feeds:
    $ref: "./paths/feeds.yaml#/collection"
  /feeds/search:
    $ref: "./paths/feeds.yaml#/search"
  /feeds/{id}:
    $ref: "./paths/feeds.yaml#/item"
  /feeds/{id}/timeline:
    $ref: "./paths/feeds.yaml#/timeline"
  /feed-entries/{id}:
    $ref: "./paths/feed-entries.yaml"
  /web-articles/{id}:
    $ref: "./paths/web-articles.yaml"
  /reading-list:
    $ref: "./paths/reading-list.yaml"
  /reading-list/{id}:
    $ref: "./paths/reading-list-item.yaml"

components:
  schemas:
    Feed:
      $ref: "./components/schemas.yaml#/Feed"
    FeedCandidate:
      $ref: "./components/schemas.yaml#/FeedCandidate"
    FeedEntry:
      $ref: "./components/schemas.yaml#/FeedEntry"
    ReadingListItem:
      $ref: "./components/schemas.yaml#/ReadingListItem"
    Story:
      $ref: "./components/schemas.yaml#/Story"
    Error:
      $ref: "./components/schemas.yaml#/Error"
  responses:
    BadRequest:
      $ref: "./components/responses.yaml#/BadRequest"
    NotFound:
      $ref: "./components/responses.yaml#/NotFound"
    InternalServerError:
      $ref: "./components/responses.yaml#/InternalServerError"
