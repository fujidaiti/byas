get:
  summary: Get a reading list item by ID
  operationId: getReadingListItem
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [id, kind, archived, saved_at, attributes]
            properties:
              id:
                type: integer
              kind:
                description: The kind of the reading list item.
                type: string
                enum: [web_article]
              archived:
                type: boolean
              saved_at:
                type: string
                format: date-time
              attributes:
                description:
                  Kind-specific attributes of the item. The shape depends on the
                  value of `kind`; currently only `web_article` is supported.
                $ref: "../components/schemas.yaml#/WebArticle"
          example:
            id: 1
            kind: web_article
            archived: false
            saved_at: "2026-05-26T02:29:39.785457+09:00"
            attributes:
              url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
              title: "Demystifying evals for AI agents"
              description:
                "The capabilities that make agents useful also make them
                difficult to evaluate."
              content:
                "<article><h2>Introduction</h2><p>Good evaluations help teams
                ship AI agents more confidently...</p></article>"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"

patch:
  summary: Archive or unarchive a reading list item
  operationId: setReadingListItemArchivedStatus
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [archived]
          properties:
            archived:
              type: boolean
        example:
          archived: true
  responses:
    "204":
      description: No Content
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"
