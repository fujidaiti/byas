get:
  summary: Get the reading list
  description:
    Returns all unarchived reading list items, most recently saved first. Web
    articles whose content hasn't been fetched yet (or whose fetch failed) are
    still included, with an empty `title`.
  operationId: getReadingList
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/ReadingListItem"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"

post:
  summary: Save an item to the reading list
  description:
    Saves an item to the reading list, either a web article (via `url`), a feed
    entry (via `feed_entry_id`), or an already-existing web article (via
    `web_article_id`). Exactly one of the three must be specified. When saving a
    web article, a placeholder item is appended immediately, and its content is
    fetched and filled in asynchronously afterwards; in this case a 201 response
    only means the placeholder was appended successfully — the article fetch may
    still fail behind the scenes. An optional `title` may be supplied alongside
    `url` (e.g. the page title shared by the browser) to give the placeholder a
    meaningful label until the fetch fills in the real one.
  operationId: saveToReadingList
  requestBody:
    description:
      The item to save. Specify exactly one of `url`, `feed_entry_id`, or
      `web_article_id`.
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  description: The URL of the web article to save.
                  type: string
                  format: uri
                title:
                  description:
                    Optional placeholder title (e.g. the page title shared by
                    the browser). Shown until the article is fetched; a
                    successful fetch replaces it with the extracted title.
                  type: string
            - type: object
              additionalProperties: false
              required: [feed_entry_id]
              properties:
                feed_entry_id:
                  description: The ID of the feed entry to save.
                  type: integer
            - type: object
              additionalProperties: false
              required: [web_article_id]
              properties:
                web_article_id:
                  description:
                    The ID of an already-existing web article to re-save.
                  type: integer
          example:
            url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
          example: {}
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"
