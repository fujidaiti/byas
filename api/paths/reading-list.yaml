get:
  summary: Get the reading list
  description:
    Returns all unarchived reading list items, most recently saved first. Web
    articles whose content hasn't been fetched yet (or whose fetch failed) are
    still included, with an empty `title`.
  operationId: getReadingList
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/ReadingListItem"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"

post:
  summary: Save an item to the reading list
  description:
    Saves an item to the reading list, either a web article (via `url`) or a
    feed entry (via `feed_entry_id`). Exactly one of the two must be specified.
    When saving a web article, a placeholder item is appended immediately, and
    its content is fetched and filled in asynchronously afterwards; in this case
    a 201 response only means the placeholder was appended successfully — the
    article fetch may still fail behind the scenes.
  operationId: saveToReadingList
  requestBody:
    description:
      The item to save. Specify exactly one of `url` or `feed_entry_id`.
    content:
      application/json:
        schema:
          type: object
          properties:
            url:
              description: The URL of the web article to save.
              type: string
              format: uri
            feed_entry_id:
              description: The ID of the feed entry to save.
              type: integer
          example:
            url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
          example: {}
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"
