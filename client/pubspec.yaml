name: paperdoll
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  logging: ^1.3.0
  openapi:
    path: ../api/dart_binding
  riverpod_annotation: ^4.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.0

  freezed: ^3.2.6-dev.1
  patrol: ^4.7.1
  http: ^1.6.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

patrol:
  app_name: Test
  test_directory: integration_test
  android:
    package_name: dev.norelease.paperdoll
